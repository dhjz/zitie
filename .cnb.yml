$:
  vscode:
    - docker:
        image: cnbcool/default-dev-env:latest
      runner:
        cpus: 8
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls -al
        - name: merge
          script: wget -qO ~/dufs.tar.gz "https://cnb.cool/dhjzz/lib/-/git/raw/main/amd64/dufs.tar.gz" && tar -xzf ~/dufs.tar.gz -C /usr/local/bin && cp /usr/local/bin/dufs /usr/local/bin/fs