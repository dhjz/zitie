<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6ef7" />
    <title>字帖 · 田字格字帖生成器</title>
    <meta name="keywords" content="字帖,田字格字帖,笔顺字帖,拼音字帖,英文字帖,数学练习,口算题,描红,在线生成,打印字帖,米字格,回宫格" />
    <meta name="description" content="纯前端离线字帖生成器：汉字描红与笔顺、拼音、英文四线三格、数学口算、词语文章、空白练习纸。A4 排版，浏览器直接打印或存 PDF。" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="static/app.css?v=8" />
  </head>
  <body>
    <!-- 根组件：模板写在这里，逻辑在 static/index.js。
         四个 <script> 的顺序不能动：vue → utils（数据/排版）→ ui（组件）→ page.* → index。 -->
    <div id="app" v-cloak>
      <div class="app">
        <header class="topbar no-print">
          <div class="topbar-in">
            <button class="brand" @click="go('home')">
              <span class="brand-logo">字</span>
              <span>
                <div class="brand-name">字帖工坊</div>
                <div class="brand-sub">zitie</div>
              </span>
            </button>
            <nav class="nav">
              <button v-for="r in routes" :key="r.name" class="nav-item"
                :class="{ on: route === r.name }" @click="go(r.name)">{{ r.title }}</button>
            </nav>
            <div class="topbar-right">
              <button class="icon-btn" :title="dark ? '切到亮色' : '切到暗色'" @click="toggleTheme">{{ dark ? '☀️' : '🌙' }}</button>
              <button class="icon-btn" title="使用说明" @click="go('guide')">?</button>
            </div>
          </div>
        </header>

        <main class="wrap">
          <home-page v-if="route === 'home'" @go="go"></home-page>
          <hanzi-page v-else-if="route === 'hanzi'"></hanzi-page>
          <pinyin-page v-else-if="route === 'pinyin'"></pinyin-page>
          <letter-page v-else-if="route === 'eletter'"></letter-page>
          <math-page v-else-if="route === 'math'"></math-page>
          <stage-page v-else-if="route === 'stage'"></stage-page>
          <pen-page v-else-if="route === 'pen'"></pen-page>
          <blank-page v-else-if="route === 'blank'"></blank-page>
          <guide-page v-else-if="route === 'guide'"></guide-page>
        </main>

        <z-toasts></z-toasts>
      </div>
    </div>

    <script src="static/vue3.prod.js"></script>
    <script>
      // 主题先定，否则亮底会闪一下再变暗
      (function () {
        try {
          var t = localStorage.getItem('zitie:theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
      window.myComponents = {};
    </script>
    <script src="static/data/pinyin-pro.js"></script>
    <script src="static/utils.js?v=7"></script>
    <script src="static/ui.js?v=8"></script>
    <script src="static/page.home.js?v=6"></script>
    <script src="static/page.hanzi.js?v=4"></script>
    <script src="static/page.pinyin.js?v=5"></script>
    <script src="static/page.eletter.js?v=3"></script>
    <script src="static/page.math.js?v=3"></script>
    <script src="static/page.stage.js?v=4"></script>
    <script src="static/page.pen.js?v=6"></script>
    <script src="static/page.blank.js?v=3"></script>
    <script src="static/page.guide.js?v=3"></script>
    <script src="static/index.js?v=5"></script>
  </body>
</html>
